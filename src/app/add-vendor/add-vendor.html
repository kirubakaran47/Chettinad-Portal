<div *ngIf="isLoading" class="loader-overlay">
  <div class="loader"></div>
</div>
<div class="content-section">
  <div class="row tittle">
    <div class="top col-md-5 align-self-center">
      <h5>Add Vendor</h5>
    </div>
    <div class="col-md-7 align-self-center">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="javascript:void(0)" (click)="home()">Home</a></li>
        <li class="breadcrumb-item active">Add Vendor</li>
      </ol>
    </div>
  </div>
  <div class="card">
    <div class="card-body">
      <form [formGroup]="vendorForm" (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-12 col-sm-6 col-lg-4">
            <div class="form-group row">
              <label for="company_code" class="col-lg-12 col-form-label">Company
                Code</label>
              <div class="col-lg-12">
                <input type="text" id="company_code" formControlName="company_code" class="form-control" readonly>
              </div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-lg-4">
            <div class="form-group row">
              <label for="company_name" class="col-lg-12 col-form-label">Company
                Name <span style="color: red;">*</span></label>
              <div class="col-lg-12">
                <input type="text" id="company_name" formControlName="company_name" class="form-control">
                <div *ngIf="vendorForm.get('company_name')?.touched && vendorForm.get('company_name')?.invalid">
                  <small class="text-danger" *ngIf="vendorForm.get('company_name')?.hasError('required')">Company
                    Name
                    is required.</small>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-sm-6 col-lg-4">
            <div class="form-group row">
              <label for="vendor_name" class="col-lg-12 col-form-label">Vendor
                Name <span style="color: red;">*</span></label>
              <div class="col-lg-12">
                <input type="text" id="vendor_name" formControlName="vendor_name" class="form-control">
                <div *ngIf="vendorForm.get('vendor_name')?.touched && vendorForm.get('vendor_name')?.invalid">
                  <small class="text-danger" *ngIf="vendorForm.get('vendor_name')?.hasError('required')">Vendor
                    Name is
                    required.</small>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-sm-6 col-lg-4">
            <div class="form-group row">
              <label for="address_1" class="col-lg-12 col-form-label">Address-1 </label>
              <div class="col-lg-12">
                <input type="text" id="address_1" formControlName="address_1" class="form-control">
              </div>
            </div>
          </div>

          <div class="col-12 col-sm-6 col-lg-4">
            <div class="form-group row">
              <label for="address_2" class="col-lg-12 col-form-label">Address-2</label>
              <div class="col-lg-12">
                <input type="text" id="address_2" formControlName="address_2" class="form-control">
              </div>
            </div>
          </div>

          <div class="col-12 col-sm-6 col-lg-4">
            <div class="form-group row">
              <label for="city" class="col-lg-12 col-form-label">City </label>
              <div class="col-lg-12">
                <input type="text" id="city" formControlName="city" class="form-control">
              </div>
            </div>
          </div>

          <div class="col-12 col-sm-6 col-lg-4">
            <div class="form-group row">
              <label for="phone" class="col-lg-12 col-form-label">Phone</label>
              <div class="col-lg-12">
                <input type="number" id="phone" formControlName="phone" class="form-control">
              </div>
            </div>
          </div>

          <div class="col-12 col-sm-6 col-lg-4">
            <div class="form-group row">
              <label for="mobile_phone" class="col-lg-12 col-form-label">Mobile </label>
              <div class="col-lg-12">
                <input type="number" id="mobile_phone" formControlName="mobile_phone" class="form-control">
              </div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-lg-4">
            <div class="form-group row">
              <label for="fax" class="col-lg-12 col-form-label">Fax</label>
              <div class="col-lg-12">
                <input type="email" id="fax" formControlName="fax" class="form-control">
              </div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-lg-4">
            <div class="form-group row">
              <label for="e_mail" class="col-lg-12 col-form-label">Email</label>
              <div class="col-lg-12">
                <input type="email" id="e_mail" formControlName="e_mail" class="form-control">
              </div>
            </div>
          </div>

          <div class="col-12 col-sm-6 col-lg-4">
            <div class="form-group row">
              <label for="bank" class="col-lg-12 col-form-label">Bank Details</label>
              <div class="col-lg-12">
                <input type="text" id="bank" formControlName="bank" class="form-control">
              </div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-lg-4">
            <div class="row checkbox">
              <label for="bank" class="col-lg-12 col-form-label">Vendor Classification
              </label>
              <div class="col-lg-12 d-flex">
                <!-- <div class="form-group">
                  <label for="gas">Gas</label>
                  <input type="checkbox" id="gas" name="gas" formControlName="gas">
                </div> -->
                <div class="form-group">
                  <label for="oil">Purchase</label>
                  <input type="checkbox" id="oil" name="oil" formControlName="oil">
                </div>
                <div class="form-group">
                  <label for="expense">Expense</label>
                  <input type="checkbox" id="expense" name="expense" formControlName="expense">
                </div>
                <!-- <div class="form-group">
                  <label for="transport">Transport </label>
                  <input type="checkbox" id="transport" name="transport" formControlName="transport">
                </div> -->
              </div>

            </div>
          </div>

        </div>

        <div class="btn-apply">
          <button class="btn btn-primary" type="submit">Save Vendor</button>
          <button class="btn btn-secondary" type="button" (click)="cancel()">Cancel</button>
        </div>
      </form>

    </div>
  </div>
</div>
